<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Card Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
            max-width: 900px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #fff;
            margin-bottom: 25px;
            font-size: 2.5em;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
            letter-spacing: 2px;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            margin-bottom: 25px;
            background: rgba(255, 255, 255, 0.15);
            padding: 20px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
            gap: 30px;
            flex-wrap: wrap;
        }

        .stat-item {
            text-align: center;
        }

        .stat-label {
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 2em;
            font-weight: bold;
            color: #00ff88;
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
        }

        .difficulty-selector {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .difficulty-btn {
            padding: 10px 20px;
            font-size: 0.95em;
            font-weight: bold;
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .difficulty-btn.active {
            background: linear-gradient(135deg, #00ff88 0%, #00cc88 100%);
            color: #000;
            border-color: #00ff88;
            transform: scale(1.05);
        }

        .difficulty-btn:hover {
            transform: translateY(-2px);
            border-color: #00ff88;
        }

        .game-board {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 25px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 15px;
        }

        .game-board.easy {
            grid-template-columns: repeat(4, 1fr);
        }

        .game-board.medium {
            grid-template-columns: repeat(4, 1fr);
        }

        .game-board.hard {
            grid-template-columns: repeat(6, 1fr);
        }

        .card {
            aspect-ratio: 1;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5em;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            user-select: none;
            position: relative;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0, 255, 136, 0.3);
        }

        .card.flipped {
            background: linear-gradient(135deg, #00ff88 0%, #00cc88 100%);
            border-color: #00ff88;
            transform: rotateY(180deg);
            box-shadow: 0 4px 15px rgba(0, 255, 136, 0.4);
        }

        .card.matched {
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            border-color: #FFD700;
            cursor: default;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.6);
        }

        .card.matched:hover {
            transform: none;
        }

        .card-inner {
            font-weight: bold;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 30px;
            font-size: 1em;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .btn-start {
            background: linear-gradient(135deg, #00ff88 0%, #00cc88 100%);
            color: #000;
        }

        .btn-start:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 255, 136, 0.4);
        }

        .btn-reset {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a52 100%);
            color: #fff;
        }

        .btn-reset:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 107, 107, 0.4);
        }

        .instructions {
            text-align: center;
            color: rgba(255, 255, 255, 0.9);
            font-size: 0.95em;
            line-height: 1.6;
        }

        .instructions p {
            margin-bottom: 8px;
        }

        .instructions strong {
            color: #00ff88;
            text-shadow: 0 0 8px rgba(0, 255, 136, 0.3);
        }

        .game-over-modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            display: none;
            z-index: 1000;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            border: 2px solid #00ff88;
            animation: popIn 0.3s ease;
        }

        .game-over-modal.show {
            display: block;
        }

        @keyframes popIn {
            from {
                transform: translate(-50%, -50%) scale(0.5);
                opacity: 0;
            }
            to {
                transform: translate(-50%, -50%) scale(1);
                opacity: 1;
            }
        }

        .game-over-modal h2 {
            color: #00ff88;
            font-size: 2.5em;
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
        }

        .game-over-modal p {
            color: #fff;
            font-size: 1.2em;
            margin-bottom: 15px;
        }

        .game-over-modal button {
            background: linear-gradient(135deg, #00ff88 0%, #00cc88 100%);
            color: #000;
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 20px;
        }

        .game-over-modal button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 255, 136, 0.4);
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            z-index: 999;
        }

        .overlay.show {
            display: block;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 1.8em;
                margin-bottom: 15px;
            }

            .game-board {
                gap: 10px;
                padding: 15px;
            }

            .game-board.hard {
                grid-template-columns: repeat(4, 1fr);
            }

            .card {
                font-size: 1.8em;
            }

            .stats {
                gap: 15px;
            }

            .stat-value {
                font-size: 1.5em;
            }

            .btn {
                padding: 10px 20px;
                font-size: 0.9em;
            }

            .difficulty-btn {
                padding: 8px 15px;
                font-size: 0.85em;
            }

            .instructions {
                font-size: 0.85em;
            }
        }
    </style>
</head>
<body>
    <div class="overlay" id="overlay"></div>

    <div class="container">
        <h1>🎴 MEMORY GAME</h1>
        
        <div class="stats">
            <div class="stat-item">
                <div class="stat-label">Moves</div>
                <div id="moves" class="stat-value">0</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">Matches</div>
                <div id="matches" class="stat-value">0</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">Time</div>
                <div id="timer" class="stat-value">0s</div>
            </div>
        </div>

        <div class="difficulty-selector">
            <button class="difficulty-btn active" data-difficulty="easy">Easy (4x4)</button>
            <button class="difficulty-btn" data-difficulty="medium">Medium (4x5)</button>
            <button class="difficulty-btn" data-difficulty="hard">Hard (6x6)</button>
        </div>

        <div class="game-board easy" id="gameBoard"></div>

        <div class="controls">
            <button id="startBtn" class="btn btn-start">Start Game</button>
            <button id="resetBtn" class="btn btn-reset">New Game</button>
        </div>

        <div class="instructions">
            <p><strong>Goal:</strong> Find all matching pairs! The fewer moves, the better!</p>
            <p><strong>Tips:</strong> Remember card positions and try to match pairs efficiently</p>
        </div>
    </div>

    <div class="game-over-modal" id="gameOverModal">
        <h2>🎉 You Won!</h2>
        <p id="gameOverMessage">Moves: <span id="finalMoves">0</span> | Time: <span id="finalTime">0</span>s</p>
        <button onclick="resetGame()">Play Again</button>
    </div>

 <script>
        // Oyun Ayarları
        // 6x6 (36 kart) için yeterli emoji listesi
        const emojis = ['🐶', '🐱', '🐭', '🐹', '🐰', '🦊', '🐻', '🐼', '🐨', '🐯', '🦁', '🐮', '🐷', '🐸', '🐵', '🐔', '🐧', '🐘', '🐺', '🐗', '🐴', '🦄', '🐝', '🐛', '🦋', '🐙', '🐢', '🦖'];
        
        let gameBoard = document.getElementById('gameBoard');
        let cards = [];
        let flippedCards = [];
        let matchedPairs = 0;
        let moves = 0;
        let gameRunning = false;
        let gameStarted = false;
        let startTime = 0;
        let timerInterval = null;
        let currentDifficulty = 'easy';
        
        // DÜZELTME: Toplam kart sayıları (16, 20, 36)
        let gridSize = { easy: 16, medium: 20, hard: 36 };

        // Zorluk butonları için dinleyiciler
        document.querySelectorAll('.difficulty-btn').forEach(btn => {
            btn.addEventListener('click', changeDifficulty);
        });

        document.getElementById('startBtn').addEventListener('click', startGame);
        document.getElementById('resetBtn').addEventListener('click', resetGame);

        function changeDifficulty(e) {
            if (gameRunning || gameStarted) return;
            document.querySelectorAll('.difficulty-btn').forEach(btn => btn.classList.remove('active'));
            e.target.classList.add('active');
            currentDifficulty = e.target.dataset.difficulty;
            gameBoard.className = `game-board ${currentDifficulty}`;
            initializeGame();
        }

        function initializeGame() {
            const totalCards = gridSize[currentDifficulty]; // Toplam kart sayısı
            const pairCount = totalCards / 2; // Çift sayısı
            
            // Emojileri seç ve çiftle
            let selectedEmojis = emojis.slice(0, pairCount);
            let gameEmojis = [...selectedEmojis, ...selectedEmojis]; 
            
            // Karıştırma (Shuffle)
            for (let i = gameEmojis.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [gameEmojis[i], gameEmojis[j]] = [gameEmojis[j], gameEmojis[i]];
            }

            gameBoard.innerHTML = '';
            cards = [];

            for (let i = 0; i < totalCards; i++) {
                const card = document.createElement('div');
                card.className = 'card';
                card.dataset.emoji = gameEmojis[i];
                
                const inner = document.createElement('div');
                inner.className = 'card-inner';
                inner.textContent = '?';
                card.appendChild(inner);

                card.addEventListener('click', () => flipCard(card));
                gameBoard.appendChild(card);
                cards.push(card);
            }

            matchedPairs = 0;
            moves = 0;
            flippedCards = [];
            updateStats();
        }

        function startGame() {
            if (gameStarted) return;
            gameRunning = true;
            gameStarted = true;
            startTime = Date.now();
            document.getElementById('startBtn').textContent = 'Oyun Başladı';
            document.getElementById('startBtn').disabled = true;
            startTimer();
        }

        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                const elapsedSeconds = Math.floor((Date.now() - startTime) / 1000);
                document.getElementById('timer').textContent = elapsedSeconds + 's';
            }, 1000);
        }

        function flipCard(card) {
            if (!gameRunning) return;
            if (card.classList.contains('flipped') || card.classList.contains('matched')) return;
            if (flippedCards.length === 2) return;

            card.classList.add('flipped');
            card.querySelector('.card-inner').textContent = card.dataset.emoji;
            flippedCards.push(card);

            if (flippedCards.length === 2) {
                moves++;
                updateStats();
                checkMatch();
            }
        }

        function checkMatch() {
            const [card1, card2] = flippedCards;
            const isMatch = card1.dataset.emoji === card2.dataset.emoji;

            if (isMatch) {
                setTimeout(() => {
                    card1.classList.add('matched');
                    card2.classList.add('matched');
                    matchedPairs++;
                    updateStats();
                    if (matchedPairs === gridSize[currentDifficulty] / 2) endGame();
                    flippedCards = [];
                }, 300);
            } else {
                setTimeout(() => {
                    card1.classList.remove('flipped');
                    card2.classList.remove('flipped');
                    card1.querySelector('.card-inner').textContent = '?';
                    card2.querySelector('.card-inner').textContent = '?';
                    flippedCards = [];
                }, 800);
            }
        }

        function updateStats() {
            document.getElementById('moves').textContent = moves;
            document.getElementById('matches').textContent = matchedPairs;
        }

        function endGame() {
            gameRunning = false;
            clearInterval(timerInterval);
            const finalTime = document.getElementById('timer').textContent;
            document.getElementById('finalMoves').textContent = moves;
            document.getElementById('finalTime').textContent = finalTime.replace('s', '');
            document.getElementById('overlay').classList.add('show');
            document.getElementById('gameOverModal').classList.add('show');
        }

        function resetGame() {
            gameRunning = false;
            gameStarted = false;
            clearInterval(timerInterval);
            document.getElementById('startBtn').textContent = 'Başlat';
            document.getElementById('startBtn').disabled = false;
            document.getElementById('overlay').classList.remove('show');
            document.getElementById('gameOverModal').classList.remove('show');
            document.getElementById('timer').textContent = '0s';
            initializeGame();
        }

        initializeGame();
    </script>
</body>
</html>
