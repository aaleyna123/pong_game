<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pong Game - Fixed</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            touch-action: none; 
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
            overflow: hidden; 
        }

        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
            max-width: 900px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #fff;
            margin-bottom: 20px;
            font-size: 2em;
        }

        .game-wrapper {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
            border-radius: 10px;
            overflow: hidden;
            background: #000;
        }

        #pongCanvas {
            background: #1a1a2e;
            display: block;
            max-width: 100%;
            height: auto;
        }

        .scoreboard {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
            background: rgba(255, 255, 255, 0.15);
            padding: 15px;
            border-radius: 10px;
        }

        .score-item { text-align: center; }
        .score { font-size: 2.5em; font-weight: bold; color: #00ff88; }
        .score-label { color: white; font-size: 0.8em; }

        .controls { display: flex; justify-content: center; gap: 10px; }
        .btn {
            padding: 10px 25px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
        }
        .btn-start { background: #00ff88; color: #000; }
        .btn-reset { background: #ff6b6b; color: #fff; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 PONG GAME</h1>
        
        <div class="game-wrapper">
            <canvas id="pongCanvas" width="800" height="400"></canvas>
        </div>

        <div class="scoreboard">
            <div class="score-item">
                <div class="score-label">PLAYER</div>
                <div id="playerScore" class="score">0</div>
            </div>
            <div style="color:white; font-size: 2em;">:</div>
            <div class="score-item">
                <div class="score-label">COMPUTER</div>
                <div id="computerScore" class="score">0</div>
            </div>
        </div>

        <div class="controls">
            <button id="startBtn" class="btn btn-start">Start Game</button>
            <button id="resetBtn" class="btn btn-reset">Reset Score</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('pongCanvas');
        const ctx = canvas.getContext('2d');

        const paddleWidth = 12;
        const paddleHeight = 85;

        const player = { x: 10, y: 160, width: paddleWidth, height: paddleHeight, speed: 10 };
        const computer = { x: 778, y: 160, width: paddleWidth, height: paddleHeight, speed: 4.5 };
        const ball = { x: 400, y: 200, dx: 5, dy: 5, radius: 7, speed: 6 };

        let gameRunning = false;
        let playerScore = 0;
        let computerScore = 0;
        let pointerY = 200;
        let usePointer = false;

        const keys = { ArrowUp: false, ArrowDown: false };

        // --- KONTROL DÜZELTMELERİ ---

        function handlePointer(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleY = canvas.height / rect.height;
            
            let clientY;
            if (e.type.includes('touch')) {
                clientY = e.touches[0].clientY;
                e.preventDefault(); 
            } else {
                clientY = e.clientY;
            }

            pointerY = (clientY - rect.top) * scaleY;
            usePointer = true;
        }

        canvas.addEventListener('mousemove', handlePointer);
        canvas.addEventListener('touchmove', handlePointer, { passive: false });
        canvas.addEventListener('touchstart', handlePointer, { passive: false });

      
        window.addEventListener('keydown', (e) => {
            if (["ArrowUp", "ArrowDown", " "].includes(e.key)) {
                e.preventDefault(); 
            }
            if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
                keys[e.key] = true;
                usePointer = false;
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowUp' || e.key === 'ArrowDown') keys[e.key] = false;
        });

        // --- OYUN MANTIĞI ---

        function update() {
            if (!gameRunning) return;

            // Player Hareket
            if (keys.ArrowUp) player.y -= player.speed;
            if (keys.ArrowDown) player.y += player.speed;

            if (usePointer) {
                let targetY = pointerY - player.height / 2;
                player.y += (targetY - player.y) * 0.2; 
            }

            // Player Sınır
            if (player.y < 0) player.y = 0;
            if (player.y + player.height > canvas.height) player.y = canvas.height - player.height;

            // Computer AI (Biraz hata payı bırakıldı ki yenilebilsin)
            let computerCenter = computer.y + computer.height / 2;
            if (computerCenter < ball.y - 35) computer.y += computer.speed;
            else if (computerCenter > ball.y + 35) computer.y -= computer.speed;

            // Top Hareket
            ball.x += ball.dx;
            ball.y += ball.dy;

            // Duvar Çarpma
            if (ball.y - ball.radius < 0 || ball.y + ball.radius > canvas.height) ball.dy *= -1;

            // Raket Çarpma
            let currentPaddle = (ball.x < canvas.width/2) ? player : computer;
            if (checkCollision(ball, currentPaddle)) {
                ball.dx *= -1.05;
                let collidePoint = (ball.y - (currentPaddle.y + currentPaddle.height/2));
                collidePoint = collidePoint / (currentPaddle.height/2);
                ball.dy = collidePoint * 7;
            }

            // Sayı Kaydetme
            if (ball.x < 0) {
                computerScore++;
                resetBall();
            } else if (ball.x > canvas.width) {
                playerScore++;
                resetBall();
            }
            
            document.getElementById('playerScore').textContent = playerScore;
            document.getElementById('computerScore').textContent = computerScore;
        }

        function checkCollision(b, p) {
            return b.x + b.radius > p.x && b.x - b.radius < p.x + p.width &&
                   b.y + b.radius > p.y && b.y - b.radius < p.y + p.height;
        }

        function resetBall() {
            ball.x = canvas.width / 2;
            ball.y = canvas.height / 2;
            ball.dx = (Math.random() > 0.5 ? 1 : -1) * 5;
            ball.dy = (Math.random() - 0.5) * 10;
        }

        function draw() {
            ctx.fillStyle = "rgba(26, 26, 46, 0.3)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Orta çizgi
            ctx.strokeStyle = "white";
            ctx.setLineDash([10, 10]);
            ctx.beginPath(); ctx.moveTo(400,0); ctx.lineTo(400,400); ctx.stroke();
            ctx.setLineDash([]);

            // Raketler ve Top
            ctx.fillStyle = "#00ff88"; // Player
            ctx.fillRect(player.x, player.y, player.width, player.height);
            
            ctx.fillStyle = "#ff6b6b"; // Computer
            ctx.fillRect(computer.x, computer.y, computer.width, computer.height);

            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI*2);
            ctx.fillStyle = "#FFD700"; // Top
            ctx.fill();
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        document.getElementById('startBtn').addEventListener('click', () => {
            gameRunning = !gameRunning;
            document.getElementById('startBtn').textContent = gameRunning ? "Pause" : "Start Game";
        });

        document.getElementById('resetBtn').addEventListener('click', () => {
            playerScore = 0; computerScore = 0;
            resetBall();
        });

        loop();
    </script>
</body>
</html>
