<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pong Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
            max-width: 900px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #fff;
            margin-bottom: 25px;
            font-size: 2.5em;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
            letter-spacing: 2px;
        }

        .game-wrapper {
            display: flex;
            justify-content: center;
            margin-bottom: 25px;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        #pongCanvas {
            background: linear-gradient(to bottom, #1a1a2e, #16213e);
            display: block;
            max-width: 100%;
            height: auto;
        }

        .scoreboard {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px;
            margin-bottom: 25px;
            background: rgba(255, 255, 255, 0.15);
            padding: 20px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }

        .score-item {
            text-align: center;
        }

        .score-label {
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .score {
            font-size: 3em;
            font-weight: bold;
            color: #00ff88;
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
        }

        .score-divider {
            color: rgba(255, 255, 255, 0.5);
            font-size: 2em;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 30px;
            font-size: 1em;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .btn-start {
            background: linear-gradient(135deg, #00ff88 0%, #00cc88 100%);
            color: #000;
        }

        .btn-start:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 255, 136, 0.4);
        }

        .btn-start:active {
            transform: translateY(0);
        }

        .btn-reset {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a52 100%);
            color: #fff;
        }

        .btn-reset:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 107, 107, 0.4);
        }

        .btn-reset:active {
            transform: translateY(0);
        }

        .instructions {
            text-align: center;
            color: rgba(255, 255, 255, 0.9);
            font-size: 0.95em;
            line-height: 1.6;
        }

        .instructions p {
            margin-bottom: 8px;
        }

        .instructions strong {
            color: #00ff88;
            text-shadow: 0 0 8px rgba(0, 255, 136, 0.3);
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 1.8em;
                margin-bottom: 15px;
            }

            #pongCanvas {
                width: 100%;
                height: auto;
            }

            .scoreboard {
                gap: 20px;
                padding: 15px;
            }

            .score {
                font-size: 2em;
            }

            .btn {
                padding: 10px 20px;
                font-size: 0.9em;
            }

            .instructions {
                font-size: 0.85em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 PONG GAME</h1>
        
        <div class="game-wrapper">
            <canvas id="pongCanvas" width="800" height="400"></canvas>
        </div>

        <div class="scoreboard">
            <div class="score-item">
                <div class="score-label">Player</div>
                <div id="playerScore" class="score">0</div>
            </div>
            <div class="score-divider">—</div>
            <div class="score-item">
                <div class="score-label">Computer</div>
                <div id="computerScore" class="score">0</div>
            </div>
        </div>

        <div class="controls">
            <button id="startBtn" class="btn btn-start">Start Game</button>
            <button id="resetBtn" class="btn btn-reset">Reset Score</button>
        </div>

        <div class="instructions">
            <p><strong>Controls:</strong> Use Mouse Y-position or Arrow Keys (↑↓) to move your paddle</p>
            <p><strong>Goal:</strong> Bounce the ball past the computer's paddle to score!</p>
        </div>
    </div>

    <script>
        // Canvas and context
        const canvas = document.getElementById('pongCanvas');
        const ctx = canvas.getContext('2d');

        // Game objects
        const paddleWidth = 10;
        const paddleHeight = 80;
        const ballSize = 8;

        const player = {
            x: 10,
            y: canvas.height / 2 - paddleHeight / 2,
            width: paddleWidth,
            height: paddleHeight,
            dy: 0,
            speed: 8
        };

        const computer = {
            x: canvas.width - 20,
            y: canvas.height / 2 - paddleHeight / 2,
            width: paddleWidth,
            height: paddleHeight,
            dy: 0,
            speed: 4
        };

        const ball = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            dx: 5,
            dy: 5,
            radius: ballSize,
            speed: 5
        };

        // Game state
        let gameRunning = false;
        let playerScore = 0;
        let computerScore = 0;
        let mouseY = canvas.height / 2;
        let useMouseControl = false;

        // Keyboard state
        const keys = {
            ArrowUp: false,
            ArrowDown: false
        };

        // Event listeners
        document.getElementById('startBtn').addEventListener('click', toggleGame);
        document.getElementById('resetBtn').addEventListener('click', resetScore);

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
                keys[e.key] = true;
                useMouseControl = false;
            }
        });

        document.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
                keys[e.key] = false;
            }
        });

        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            mouseY = e.clientY - rect.top;
            useMouseControl = true;
        });

        canvas.addEventListener('mouseleave', () => {
            useMouseControl = false;
        });

        // Game functions
        function toggleGame() {
            gameRunning = !gameRunning;
            const btn = document.getElementById('startBtn');
            btn.textContent = gameRunning ? 'Pause Game' : 'Start Game';
            if (gameRunning) {
                gameLoop();
            }
        }

        function resetScore() {
            playerScore = 0;
            computerScore = 0;
            updateScoreboard();
            resetBall();
        }

        function resetBall() {
            ball.x = canvas.width / 2;
            ball.y = canvas.height / 2;
            ball.dx = (Math.random() > 0.5 ? 1 : -1) * ball.speed;
            ball.dy = (Math.random() - 0.5) * ball.speed;
        }

        function updatePlayer() {
            if (keys.ArrowUp) {
                player.y -= player.speed;
            }
            if (keys.ArrowDown) {
                player.y += player.speed;
            }

            if (useMouseControl && !keys.ArrowUp && !keys.ArrowDown) {
                const targetY = mouseY - paddleHeight / 2;
                if (targetY < player.y) {
                    player.y -= player.speed;
                } else if (targetY > player.y) {
                    player.y += player.speed;
                }
            }

            if (player.y < 0) player.y = 0;
            if (player.y + player.height > canvas.height) {
                player.y = canvas.height - player.height;
            }
        }

        function updateComputer() {
            const computerCenter = computer.y + computer.height / 2;
            const ballCenter = ball.y;
            const difference = ballCenter - computerCenter;

            if (Math.abs(difference) > 30) {
                if (difference > 0) {
                    computer.y += computer.speed;
                } else {
                    computer.y -= computer.speed;
                }
            }

            if (computer.y < 0) computer.y = 0;
            if (computer.y + computer.height > canvas.height) {
                computer.y = canvas.height - computer.height;
            }
        }

        function updateBall() {
            ball.x += ball.dx;
            ball.y += ball.dy;

            if (ball.y - ball.radius < 0 || ball.y + ball.radius > canvas.height) {
                ball.dy = -ball.dy;
                ball.y = ball.y - ball.radius < 0 ? ball.radius : canvas.height - ball.radius;
            }

            if (
                ball.x - ball.radius < player.x + player.width &&
                ball.y > player.y &&
                ball.y < player.y + player.height
            ) {
                ball.dx = -ball.dx;
                ball.x = player.x + player.width + ball.radius;
                const hitPos = (ball.y - (player.y + player.height / 2)) / (player.height / 2);
                ball.dy += hitPos * 3;
            }

            if (
                ball.x + ball.radius > computer.x &&
                ball.y > computer.y &&
                ball.y < computer.y + computer.height
            ) {
                ball.dx = -ball.dx;
                ball.x = computer.x - ball.radius;
                const hitPos = (ball.y - (computer.y + computer.height / 2)) / (computer.height / 2);
                ball.dy += hitPos * 3;
            }

            if (ball.x - ball.radius < 0) {
                computerScore++;
                updateScoreboard();
                resetBall();
            }

            if (ball.x + ball.radius > canvas.width) {
                playerScore++;
                updateScoreboard();
                resetBall();
            }
        }

        function updateScoreboard() {
            document.getElementById('playerScore').textContent = playerScore;
            document.getElementById('computerScore').textContent = computerScore;
        }

        function draw() {
            ctx.fillStyle = 'rgba(26, 26, 46, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
            ctx.setLineDash([5, 5]);
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, 0);
            ctx.lineTo(canvas.width / 2, canvas.height);
            ctx.stroke();
            ctx.setLineDash([]);

            ctx.fillStyle = '#00ff88';
            ctx.shadowColor = 'rgba(0, 255, 136, 0.5)';
            ctx.shadowBlur = 10;
            ctx.fillRect(player.x, player.y, player.width, player.height);

            ctx.fillStyle = '#ff6b6b';
            ctx.shadowColor = 'rgba(255, 107, 107, 0.5)';
            ctx.shadowBlur = 10;
            ctx.fillRect(computer.x, computer.y, computer.width, computer.height);

            ctx.fillStyle = '#FFD700';
            ctx.shadowColor = 'rgba(255, 215, 0, 0.6)';
            ctx.shadowBlur = 15;
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fill();

            ctx.shadowColor = 'transparent';
        }

        function gameLoop() {
            if (!gameRunning) return;

            updatePlayer();
            updateComputer();
            updateBall();
            draw();

            requestAnimationFrame(gameLoop);
        }

        updateScoreboard();
        draw();
    </script>
</body>
</html>
