<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Breakout Game - Fixed</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            touch-action: none; 
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
            overflow: hidden; 
        }

        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
            max-width: 850px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #fff;
            margin-bottom: 15px;
            font-size: 2em;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        .game-wrapper {
            display: flex;
            justify-content: center;
            margin-bottom: 15px;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            background: #000;
        }

        #gameCanvas {
            background: linear-gradient(to bottom, #0f0c29, #302b63);
            display: block;
            max-width: 100%;
            height: auto; 
        }

        .stats {
            display: flex;
            justify-content: space-around;
            margin-bottom: 15px;
            background: rgba(255, 255, 255, 0.15);
            padding: 10px;
            border-radius: 10px;
            flex-wrap: wrap;
        }

        .stat-item { text-align: center; }
        .stat-label { color: #eee; font-size: 0.7em; text-transform: uppercase; }
        .stat-value { font-size: 1.4em; font-weight: bold; color: #00ff88; }

        .controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .btn {
            padding: 10px 20px;
            font-size: 0.9em;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
        }

        .btn-start { background: #00ff88; color: #000; }
        .btn-reset { background: #ff6b6b; color: #fff; }

        .game-over {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95);
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            display: none;
            z-index: 1000;
            border: 2px solid #00ff88;
        }

        .game-over.show { display: block; }
        
        @media (max-width: 600px) {
            h1 { font-size: 1.4em; }
            .stat-value { font-size: 1.1em; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧱 BREAKOUT</h1>
        
        <div class="game-wrapper">
            <canvas id="gameCanvas" width="800" height="600"></canvas>
        </div>

        <div class="stats">
            <div class="stat-item"><div class="stat-label">Score</div><div id="score" class="stat-value">0</div></div>
            <div class="stat-item"><div class="stat-label">Lives</div><div id="lives" class="stat-value">3</div></div>
            <div class="stat-item"><div class="stat-label">Bricks</div><div id="bricksLeft" class="stat-value">0</div></div>
            <div class="stat-item"><div class="stat-label">Level</div><div id="level" class="stat-value">1</div></div>
        </div>

        <div class="controls">
            <button id="startBtn" class="btn btn-start">Start</button>
            <button id="resetBtn" class="btn btn-reset">New Game</button>
        </div>
    </div>

    <div class="game-over" id="gameOverModal">
        <h2 id="gameOverTitle" style="color:#00ff88; margin-bottom:15px;">Game Over</h2>
        <p style="color:#fff; margin-bottom:20px;">Score: <span id="finalScore">0</span></p>
        <button class="btn btn-start" onclick="location.reload()">Play Again</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        
        const paddleWidth = 120;
        const paddleHeight = 15;
        const ballRadius = 8;

        const paddle = {
            x: canvas.width / 2 - paddleWidth / 2,
            y: canvas.height - 30,
            width: paddleWidth,
            height: paddleHeight,
            speed: 9
        };

        const ball = {
            x: canvas.width / 2,
            y: canvas.height - 50,
            dx: 0,
            dy: 0,
            radius: ballRadius,
            speed: 5,
            launched: false
        };

        let bricks = [];
        let gameRunning = false;
        let score = 0;
        let lives = 3;
        let level = 1;
        let mouseX = canvas.width / 2;
        let usePointerControl = false;

        const keys = { ArrowLeft: false, ArrowRight: false };

        function initBricks() {
            bricks = [];
            const rows = 4 + level; 
            const colors = ['#FF6B6B', '#4ECDC4', '#45B7D1', '#FFA07A', '#F7DC6F'];
            for (let row = 0; row < 4; row++) {
                for (let col = 0; col < 8; col++) {
                    bricks.push({
                        x: col * (80 + 10) + 45,
                        y: row * (20 + 10) + 50,
                        width: 80,
                        height: 20,
                        active: true,
                        color: colors[row % colors.length]
                    });
                }
            }
            updateBrickCount();
        }

        
        function handlePointer(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            
            let clientX;
            if (e.type.includes('touch')) {
                clientX = e.touches[0].clientX;
            } else {
                clientX = e.clientX;
            }

            mouseX = (clientX - rect.left) * scaleX;
            usePointerControl = true;
            
            if (e.type.includes('touch')) e.preventDefault(); 
        }

        canvas.addEventListener('mousemove', handlePointer);
        canvas.addEventListener('touchmove', handlePointer, { passive: false });
        canvas.addEventListener('touchstart', (e) => {
            if (!ball.launched) launchBall();
            handlePointer(e);
        }, { passive: false });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
                keys[e.key] = true;
                usePointerControl = false;
            }
            if (e.key === ' ' && !ball.launched) launchBall();
        });

        document.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') keys[e.key] = false;
        });

     

        function launchBall() {
            if (!ball.launched) {
                ball.launched = true;
                ball.dx = (Math.random() - 0.5) * 6;
                ball.dy = -ball.speed;
                gameRunning = true;
                document.getElementById('startBtn').textContent = 'Pause';
                gameLoop();
            }
        }

        function updatePaddle() {
            if (keys.ArrowLeft) paddle.x -= paddle.speed;
            if (keys.ArrowRight) paddle.x += paddle.speed;

            if (usePointerControl) {
                paddle.x = mouseX - paddle.width / 2;
            }

            if (paddle.x < 0) paddle.x = 0;
            if (paddle.x + paddle.width > canvas.width) paddle.x = canvas.width - paddle.width;

            if (!ball.launched) {
                ball.x = paddle.x + paddle.width / 2;
                ball.y = paddle.y - ball.radius - 2;
            }
        }

        function updateBall() {
            if (!ball.launched) return;
            ball.x += ball.dx;
            ball.y += ball.dy;

            if (ball.x - ball.radius < 0 || ball.x + ball.radius > canvas.width) ball.dx *= -1;
            if (ball.y - ball.radius < 0) ball.dy *= -1;

            if (ball.y + ball.radius > paddle.y && ball.x > paddle.x && ball.x < paddle.x + paddle.width) {
                ball.dy = -Math.abs(ball.speed);
                let hitPoint = (ball.x - (paddle.x + paddle.width / 2)) / (paddle.width / 2);
                ball.dx = hitPoint * 5;
            }

            bricks.forEach(b => {
                if (b.active && ball.x > b.x && ball.x < b.x + b.width && ball.y > b.y && ball.y < b.y + b.height) {
                    b.active = false;
                    ball.dy *= -1;
                    score += 10;
                    updateStats();
                    updateBrickCount();
                    checkLevelComplete();
                }
            });

            if (ball.y > canvas.height) {
                lives--;
                updateStats();
                if (lives <= 0) endGame(); else resetBall();
            }
        }

        function resetBall() {
            ball.launched = false;
            gameRunning = false;
            document.getElementById('startBtn').textContent = 'Resume';
        }

        function updateStats() {
            document.getElementById('score').textContent = score;
            document.getElementById('lives').textContent = lives;
            document.getElementById('level').textContent = level;
        }

        function updateBrickCount() {
            document.getElementById('bricksLeft').textContent = bricks.filter(b => b.active).length;
        }

        function checkLevelComplete() {
            if (bricks.filter(b => b.active).length === 0) {
                level++;
                ball.speed += 1;
                resetBall();
                initBricks();
            }
        }

        function endGame() {
            gameRunning = false;
            document.getElementById('finalScore').textContent = score;
            document.getElementById('gameOverModal').classList.add('show');
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Paddle
            ctx.fillStyle = '#00ff88';
            ctx.fillRect(paddle.x, paddle.y, paddle.width, paddle.height);

            // Ball
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI*2);
            ctx.fillStyle = '#FFD700';
            ctx.fill();
            ctx.closePath();

            // Bricks
            bricks.forEach(b => {
                if (b.active) {
                    ctx.fillStyle = b.color;
                    ctx.fillRect(b.x, b.y, b.width, b.height);
                }
            });
        }

        function gameLoop() {
            if (!gameRunning) return;
            updatePaddle();
            updateBall();
            draw();
            requestAnimationFrame(gameLoop);
        }

        function newGame() {
            score = 0; lives = 3; level = 1;
            initBricks();
            updateStats();
            draw();
        }

        document.getElementById('startBtn').addEventListener('click', () => {
            if (!ball.launched) launchBall();
            else {
                gameRunning = !gameRunning;
                if (gameRunning) gameLoop();
                document.getElementById('startBtn').textContent = gameRunning ? 'Pause' : 'Resume';
            }
        });
        document.getElementById('resetBtn').addEventListener('click', () => location.reload());

        newGame();
    </script>
</body>
</html>
